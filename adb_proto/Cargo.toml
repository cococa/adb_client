[package]
authors.workspace = true
description = "Sans-IO ADB protocol core shared by native and WebUSB drivers"
edition.workspace = true
keywords.workspace = true
license.workspace = true
name = "adb_proto"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = { version = "0.22.1" }
num-bigint = { version = "0.8.6", package = "num-bigint-dig" }
num-traits = { version = "0.2.19" }
rsa = { version = "0.9.10" }
sha1 = { version = "0.10.6", features = ["oid"] }
thiserror = { version = "2.0.18" }

# `rsa` draws key-generation entropy through rand_core 0.6 / getrandom 0.2,
# which needs its JavaScript backend on wasm32-unknown-unknown.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }

[dev-dependencies]
adb_client = { path = "../adb_client", default-features = false }
